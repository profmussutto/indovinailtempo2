<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
 body{display:flex;justify-content:center;font-family:sans-serif;background:#fffef7;padding:10px;margin:0}
 #app{max-width:820px;margin:auto;border:2px solid #222;border-radius:16px;padding:20px;background:white;width:100%;box-sizing:border-box}
 #staff{width:100%;overflow:hidden;border:1px solid #eee;border-radius:8px}
 #staff svg{width:100%!important}
 #timeGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:15px 0}
 .timeBtn{padding:16px 6px;border-radius:12px;border:2px solid #222;background:white;font-weight:bold;font-size:20px;cursor:pointer}
 .timeBtn.sel{background:#ffcc00;transform:scale(1.05)} .timeBtn.ok{background:#b6f7b6!important} .timeBtn.ko{background:#ffb3b3!important}
 button{padding:12px;font-size:16px;border-radius:10px;border:none;font-weight:bold;cursor:pointer}
 /* Schermo intero - tutta l'app */
 #app:fullscreen{max-width:100%;width:100%;height:100%;border:none;border-radius:0;overflow:auto;padding:20px}
 #app.pseudo-fs{position:fixed;inset:0;z-index:9999;max-width:100%;width:100%;height:100%;border:none;border-radius:0;overflow:auto;background:#fffef7;padding:20px}
 #fsBtn{background:#fff;color:#111;border:2px solid #222;padding:8px 12px;font-size:14px}
 /* Pulsante Esci - fuori da #app, così Sites non lo taglia */
 #exitFsBtn{display:none;position:fixed;top:12px;right:12px;z-index:99999;background:#dc2626;color:#fff;border:3px solid #fff;padding:14px 20px;font-size:18px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.4);cursor:pointer}
</style>
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
</head>
<body>
<div id="app">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
<h3 style="margin:0">🎼 Indovina il Tempo</h3>
<div style="display:flex;gap:8px;align-items:center">
<button id="fsBtn" onclick="toggleFS()">⛶ Schermo intero</button>
<select id="timeSelector" style="padding:6px;border-radius:8px;font-weight:bold"><option value="240">4 min</option><option value="120" selected>2 min</option><option value="60">60 sec</option></select>
<div id="timer" style="font-size:22px;font-weight:bold;background:#222;color:#fff;padding:6px 14px;border-radius:8px">120s</div>
</div></div>
<input id="nomeStudente" placeholder="Nome e Cognome" style="padding:8px;border-radius:6px;border:1px solid #ccc;width:100%;margin:10px 0;box-sizing:border-box">
<div id="staff"></div>
<div id="infoBattuta" style="text-align:center;font-size:13px;color:#666;margin-top:6px">Premi Inizia e indovina il tempo</div>
<div id="timeGrid"></div>
<div style="display:flex;gap:10px"><button style="flex:1;background:#ffcc00" onclick="start()">▶️ Inizia</button><button style="flex:1;background:#111;color:white" onclick="check()">Verifica</button></div>
<div id="result" style="margin-top:15px;font-weight:bold"></div>
</div>
<button id="exitFsBtn" onclick="toggleFS()">✕ Esci</button>
<script>
const {Renderer,Stave,StaveNote,Voice,Formatter,Dot,Beam}=Vex.Flow;
const TIME_SIGS=[
  {sym:"2/4",num:2,beat:4,total:8,beatTicks:4,beats:2},
  {sym:"3/4",num:3,beat:4,total:12,beatTicks:4,beats:3},
  {sym:"4/4",num:4,beat:4,total:16,beatTicks:4,beats:4},
  {sym:"6/8",num:6,beat:8,total:12,beatTicks:6,beats:2},
  {sym:"9/8",num:9,beat:8,total:18,beatTicks:6,beats:3},
];
const DURATIONS=[
  {label:"q",ticks:4,vex:{dur:"q",dots:0}},
  {label:"8",ticks:2,vex:{dur:"8",dots:0}},
  {label:"16",ticks:1,vex:{dur:"16",dots:0}},
  {label:"8dot",ticks:3,vex:{dur:"8",dots:1}},
  {label:"qdot",ticks:6,vex:{dur:"q",dots:1}},
];
let current=null,selected=null,timerInt,timeLeft=120,inizio=Date.now();
const PITCHES=["c/4","d/4","e/4","f/4","g/4","a/4","b/4","c/5","d/5","e/5"];

function makeNote(pitch,vexDef){
  let n=new StaveNote({keys:[pitch],duration:vexDef.dur});
  if(vexDef.dots>0) n.addModifier(new Dot());
  n._dots=vexDef.dots; n._ticks=vexDef.ticks||0;
  return n;
}
function generate(){
  let ts=TIME_SIGS[Math.floor(Math.random()*TIME_SIGS.length)];
  let allBeats=[];
  for(let b=0;b<ts.beats;b++){
    let rem=ts.beatTicks; let beatNotes=[];
    while(rem>0){
      let cand;
      if(ts.beatTicks===4){
        cand=DURATIONS.filter(d=>d.ticks<=rem && d.ticks<=4 && d.label!=="qdot");
      }else{
        cand=DURATIONS.filter(d=>d.ticks<=rem);
      }
      let pick=cand[Math.floor(Math.random()*cand.length)];
      beatNotes.push({pitch:PITCHES[Math.floor(Math.random()*PITCHES.length)],vex:pick.vex,ticks:pick.ticks});
      rem-=pick.ticks;
      if(beatNotes.length>8) break;
    }
    allBeats.push(beatNotes);
  }
  return {ts,beats:allBeats, flat:allBeats.flat()};
}
function draw(showTime){
  const div=document.getElementById("staff"); div.innerHTML="";
  const ren=new Renderer(div,Renderer.Backends.SVG); ren.resize(780,150);
  const ctx=ren.getContext(); const stave=new Stave(10,20,760);
  stave.addClef("treble");
  if(showTime) stave.addTimeSignature(current.ts.sym);
  stave.setContext(ctx).draw();

  let beatsVex = current.beats.map(beat=>beat.map(n=>{let vn=makeNote(n.pitch,n.vex); vn._ticks=n.ticks; return vn;}));
  let flatVex = beatsVex.flat();

  let beams=[];
  beatsVex.forEach(beatArr=>{
    let group=[];
    beatArr.forEach(n=>{
      let dur=n.getDuration(); let isBeamable = (dur==="8"||dur==="16") && n._dots===0;
      if(isBeamable) group.push(n);
      else { if(group.length>1) beams.push(new Beam(group)); group=[]; }
    });
    if(group.length>1) beams.push(new Beam(group));
  });

  let voice=new Voice({num_beats:current.ts.num,beat_value:current.ts.beat}); voice.setMode(Voice.Mode.SOFT);
  voice.addTickables(flatVex);
  new Formatter().joinVoices([voice]).formatToStave([voice],stave);
  voice.draw(ctx,stave);
  beams.forEach(b=>b.setContext(ctx).draw());
}
function buildGrid(){
  const g=document.getElementById("timeGrid"); g.innerHTML="";
  TIME_SIGS.forEach(t=>{
    let b=document.createElement("div"); b.className="timeBtn"; b.id="time-"+t.sym.replace("/","_");
    b.textContent=t.sym;
    b.onclick=()=>{selected=t; document.querySelectorAll(".timeBtn").forEach(x=>x.classList.remove("sel")); b.classList.add("sel");};
    g.appendChild(b);
  });
}
function start(){
  inizio=Date.now(); current=generate(); selected=null; buildGrid(); draw(false);
  document.getElementById("infoBattuta").textContent=`Battuta da ${current.ts.total} sedicesimi - Che tempo è?`;
  document.getElementById("result").textContent=""; timeLeft=parseInt(document.getElementById("timeSelector").value);
  document.getElementById("timer").textContent=timeLeft+"s"; clearInterval(timerInt);
  timerInt=setInterval(()=>{timeLeft--; document.getElementById("timer").textContent=timeLeft+"s"; if(timeLeft<=0){clearInterval(timerInt); check(true);}},1000);
}
function check(ft=false){
  let nome=document.getElementById("nomeStudente").value.trim(); if(!nome){alert("Scrivi nome!");return;} if(!current){alert("Premi Inizia");return;} if(!selected&&!ft){alert("Seleziona un tempo!");return;}
  let ok=selected && selected.sym===current.ts.sym ? 1:0;
  document.querySelectorAll(".timeBtn").forEach(b=>b.classList.remove("ok","ko"));
  if(selected) document.getElementById("time-"+selected.sym.replace("/","_")).classList.add(ok?"ok":"ko");
  document.getElementById("time-"+current.ts.sym.replace("/","_")).classList.add("ok");
  draw(true);
  let tempo=Math.round((Date.now()-inizio)/1000);
  document.getElementById("result").textContent=(ok?`✅ Esatto! Era ${current.ts.sym}`:`❌ Era ${current.ts.sym}`)+(ft?" ⏰ Tempo scaduto!":"");
  google.script.run.salvaRisultato(nome,ok,1-ok,tempo,current.ts.sym,selected?selected.sym:"nessuna");
  clearInterval(timerInt);
}
buildGrid(); current=generate(); draw(false);

// Schermo intero - stessa logica delle altre due app
function showExitBtn(show){
  document.getElementById('exitFsBtn').style.display = show ? 'block' : 'none';
}
function toggleFS(){
  const app = document.getElementById('app');
  const btn = document.getElementById('fsBtn');
  if(document.fullscreenElement || app.classList.contains('pseudo-fs')){
    if(document.fullscreenElement) document.exitFullscreen();
    app.classList.remove('pseudo-fs');
    btn.textContent = '⛶ Schermo intero';
    showExitBtn(false);
    return;
  }
  showExitBtn(true);
  btn.textContent = '✕ Esci';
  if(app.requestFullscreen){
    app.requestFullscreen().catch(()=>{ app.classList.add('pseudo-fs'); });
  } else { app.classList.add('pseudo-fs'); }
  setTimeout(()=>{
    if(!document.fullscreenElement && !app.classList.contains('pseudo-fs')){
      app.classList.add('pseudo-fs');
    }
  }, 300);
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement){
    document.getElementById('app').classList.remove('pseudo-fs');
    document.getElementById('fsBtn').textContent = '⛶ Schermo intero';
    showExitBtn(false);
  }
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    const app = document.getElementById('app');
    if(app.classList.contains('pseudo-fs')){ toggleFS(); }
  }
});
</script>
</body>
</html>
